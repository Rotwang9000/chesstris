<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Tetches - Chess meets Tetris">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#191925"/>
			<stop offset="0.55" stop-color="#11111a"/>
			<stop offset="1" stop-color="#0b0b12"/>
		</linearGradient>
		<radialGradient id="glow" cx="0.2" cy="0.45" r="0.7">
			<stop offset="0" stop-color="#ffcc00" stop-opacity="0.10"/>
			<stop offset="1" stop-color="#ffcc00" stop-opacity="0"/>
		</radialGradient>
	</defs>

	<rect width="1200" height="630" fill="url(#bg)"/>
	<rect width="1200" height="630" fill="url(#glow)"/>
	<rect x="0" y="0" width="1200" height="6" fill="#ffcc00"/>
	<rect x="0" y="624" width="1200" height="6" fill="#ffcc00" opacity="0.5"/>

	<g fill="#ffcc00" opacity="0.06">
		<rect x="1050" y="70" width="46" height="46" rx="4"/>
		<rect x="1100" y="70" width="46" height="46" rx="4"/>
		<rect x="1100" y="120" width="46" height="46" rx="4"/>
		<rect x="1100" y="170" width="46" height="46" rx="4"/>
	</g>

	<rect x="90" y="175" width="280" height="280" rx="34" fill="#1c1c28" stroke="#ffcc00" stroke-width="3"/>
	<g fill="#ffcc00" transform="translate(82.8,140.2) scale(4.6)">
		<rect x="13" y="40" width="38" height="11" rx="1.5"/>
		<rect x="13" y="25" width="11" height="15" rx="1.5"/>
		<rect x="26.5" y="25" width="11" height="15" rx="1.5"/>
