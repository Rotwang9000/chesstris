	<text x="418" y="462" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#b2b4c4">Real-time multiplayer &#183; play free, no sign-up</text>
	<text x="418" y="540" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="bold" fill="#ffcc00" letter-spacing="1.5">tetches.com</text>
